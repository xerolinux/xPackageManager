[workspace]
resolver = "3"
members = [
    "crates/xpm-core",
    "crates/xpm-alpm",
    "crates/xpm-flatpak",
    "crates/xpm-appimage",
    "crates/xpm-ui",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "macros"] }
async-trait = "0.1.92"
slint = { version = "=1.18.1", default-features = false, features = ["backend-qt", "backend-winit", "renderer-femtovg", "compat-1-2"] }
alpm = "5.0"
libflatpak = "0.7"
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
xpm-core = { path = "crates/xpm-core" }
xpm-alpm = { path = "crates/xpm-alpm" }
xpm-flatpak = { path = "crates/xpm-flatpak" }
xpm-appimage = { path = "crates/xpm-appimage" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Packaging build: tuned for LOW peak memory so it builds on constrained
# machines (e.g. 8GB Arch boxes with no swap) without the OOM-killer (SIGKILL)
# whacking rustc mid-compile of the big slint-generated xpm-ui crate.
# - lto = false: ThinLTO holds the whole module graph in RAM = the main OOM
#   cause; dropping it is the biggest memory win (small binary-size cost).
# - codegen-units = 16: splits the crate into more, smaller units = lower
#   peak RAM per unit and better parallelism.
[profile.pkg]
inherits = "release"
lto = false
codegen-units = 16
