[package]
name = "xpm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slint UI frontend for xPackageManager"
build = "build.rs"

[[bin]]
name = "xpackagemanager"
path = "src/main.rs"

[dependencies]
xpm-core.workspace = true
xpm-alpm.workspace = true
xpm-flatpak.workspace = true
xpm-appimage.workspace = true
slint.workspace = true
i-slint-core = "=1.18.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
jxl-oxide = { version = "0.12", default-features = false }
quick-xml = "0.42"
libc = "0.2"
sys-locale = "0.3"

[build-dependencies]
slint-build = "=1.18.1"
